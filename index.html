<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博士后申请追踪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="container">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-icon">🎓</span>
          <div class="brand-text">
            <h1>博士后申请追踪</h1>
            <p>Postdoctoral Application Tracker</p>
          </div>
        </div>
        <nav class="tab-nav" id="tabNav">
          <button class="tab-btn active" data-tab="tracker">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            我的申请
          </button>
          <button class="tab-btn" data-tab="jobs">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v2.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z"/><path d="M4 8.5V20h16V8.5"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
            岗位广告
          </button>
        </nav>
        <div class="header-actions" id="hActions"></div>
      </div>
    </div>
  </header>

  <!-- ===== Tracker Tab ===== -->
  <div id="tab-tracker">
    <section class="stats-section">
      <div class="container">
        <div class="stats-grid" id="statsGrid"></div>
      </div>
    </section>
    <section class="toolbar-section">
      <div class="container">
        <div class="toolbar">
          <div class="search-wrapper">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="搜索导师、学校、国家...">
          </div>
          <div class="filter-tabs" id="filterTabs"></div>
          <select id="sortSelect">
            <option value="date-desc">申请时间 · 最新</option>
            <option value="date-asc">申请时间 · 最早</option>
            <option value="wait-desc">等待天数 · 最长</option>
            <option value="deadline-asc">截止日期 · 最近</option>
            <option value="university">学校名称 A→Z</option>
            <option value="qs-asc">QS 排名 · 最高</option>
            <option value="hindex-desc">H 指数 · 最高</option>
            <option value="papers-desc">一区论文 · 最多</option>
          </select>
        </div>
      </div>
    </section>
    <main class="main">
      <div class="container">
        <div class="table-wrapper">
          <table class="app-table" id="appTable">
            <thead>
              <tr>
                <th>导师 / 学校</th>
                <th>相关链接</th>
                <th>H 指数 / 一区论文</th>
                <th>申请 / 截止日期</th>
                <th>等待天数</th>
                <th>状态</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">📋</div>
            <p class="empty-title">暂无申请记录</p>
            <p class="empty-sub">点击「添加申请」开始记录你的博士后申请之旅</p>
            <button class="btn btn-primary mt-8" id="emptyAddBtn">添加第一条申请</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ===== Jobs Tab ===== -->
  <div id="tab-jobs" style="display:none">
    <div class="container job-tab-content">
      <div class="job-section-header">
        <h2 class="job-section-title">快速跳转求职平台</h2>
      </div>
      <div class="job-boards" id="jobBoards"></div>

      <div class="job-section-header" style="margin-top:28px">
        <h2 class="job-section-title">最新岗位广告</h2>
        <div class="job-meta-bar">
          <div class="job-source-filters" id="jobSourceFilters"></div>
          <span class="job-last-updated" id="jobLastUpdated"></span>
        </div>
      </div>
      <div class="job-keyword-bar">
        <div class="search-wrapper" style="max-width:280px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="jobSearchInput" placeholder="过滤岗位关键词...">
        </div>
      </div>
      <div class="job-grid" id="jobGrid">
        <div class="job-loading" id="jobLoading">
          <div class="spinner"></div>
          <p>正在加载最新岗位...</p>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ===== Add / Edit Modal ===== -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">添加申请</h2>
      <button class="modal-close" id="modalClose" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="appForm" class="modal-form" novalidate>
      <input type="hidden" id="editId">

      <!-- PI 信息 -->
      <div class="form-section">
        <p class="form-section-title">导师信息</p>
        <div class="form-row">
          <div class="form-group ac-wrap" id="piNameWrap">
            <label>导师姓名 <span class="req">*</span>
              <span class="ac-badge">AI 自动补全</span>
            </label>
            <input type="text" id="piName" autocomplete="off" placeholder="输入后从下拉选择，自动获取 H 指数等数据">
            <div class="ac-drop" id="piDrop"></div>
          </div>
          <div class="form-group">
            <label>职称</label>
            <select id="piTitle">
              <option value="">—</option>
              <option>Assistant Professor</option>
              <option>Associate Professor</option>
              <option>Full Professor</option>
              <option>Principal Investigator</option>
              <option>Group Leader</option>
              <option>Senior Scientist</option>
              <option>Director / Chair</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Google Scholar 链接</label>
            <input type="url" id="scholarUrl" placeholder="https://scholar.google.com/citations?user=...">
          </div>
          <div class="form-group">
            <label>H 指数 <span class="form-hint">（OpenAlex 自动填充）</span></label>
            <input type="number" id="hIndex" placeholder="e.g. 85" min="0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>研究方向</label>
            <input type="text" id="researchArea" placeholder="e.g. Chemical Proteomics, Drug Discovery">
          </div>
          <div class="form-group">
            <label>近5年一区论文数 <span class="form-hint">（Nature/Science/Cell 正刊及子刊）</span></label>
            <input type="number" id="topPapers" placeholder="e.g. 12" min="0">
          </div>
        </div>
      </div>

      <!-- 机构信息 -->
      <div class="form-section">
        <p class="form-section-title">机构信息</p>
        <div class="form-row">
          <div class="form-group ac-wrap" id="uniWrap">
            <label>学校 <span class="req">*</span>
              <span class="ac-badge">自动填充排名 + 国旗</span>
            </label>
            <input type="text" id="university" autocomplete="off" placeholder="输入学校名称...">
            <div class="ac-drop" id="uniDrop"></div>
          </div>
          <div class="form-group">
            <label>院系</label>
            <input type="text" id="department" placeholder="e.g. Department of Chemistry">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>国家</label>
            <div class="flag-row">
              <span class="flag-preview" id="flagPreview"></span>
              <input type="text" id="country" placeholder="自动填充" readonly style="flex:1;cursor:default">
              <input type="hidden" id="countryCode">
            </div>
          </div>
          <div class="form-group">
            <label>QS 世界排名 <span class="form-hint">（2025）</span></label>
            <input type="number" id="qsRank" placeholder="e.g. 1（自动填充）" min="1">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>课题组主页</label>
            <input type="url" id="labWebsite" placeholder="https://lab.university.edu">
          </div>
          <div class="form-group">
            <label>经费来源</label>
            <input type="text" id="fundingSource" placeholder="e.g. NIH R01, ERC Starting Grant, HHMI">
          </div>
        </div>
      </div>

      <!-- 申请信息 -->
      <div class="form-section">
        <p class="form-section-title">申请信息</p>
        <div class="form-row">
          <div class="form-group">
            <label>联系邮箱</label>
            <input type="email" id="contactEmail" placeholder="pi@university.edu">
          </div>
          <div class="form-group">
            <label>联系方式</label>
            <select id="contactMethod">
              <option value="">—</option>
              <option value="email">邮件直接联系</option>
              <option value="portal">官方申请系统</option>
              <option value="linkedin">LinkedIn 联系</option>
              <option value="referral">内部推荐</option>
              <option value="conference">学术会议认识</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>申请日期 <span class="req">*</span></label>
            <input type="date" id="applicationDate">
          </div>
          <div class="form-group">
            <label>截止日期</label>
            <input type="date" id="deadline">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>申请系统链接</label>
            <input type="url" id="portalUrl" placeholder="https://apply.university.edu/...">
          </div>
          <div class="form-group">
            <label>当前状态 <span class="req">*</span></label>
            <select id="status">
              <option value="contacted">已联系</option>
              <option value="applied">已网申</option>
              <option value="interviewing">面试中</option>
              <option value="no_response">未回复</option>
              <option value="rejected">已拒绝</option>
              <option value="accepted">已录取 🎉</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 进展 -->
      <div class="form-section">
        <p class="form-section-title">进展记录</p>
        <div class="form-row">
          <div class="form-group">
            <label>面试日期</label>
            <input type="date" id="interviewDate">
          </div>
          <div class="form-group">
            <label>下次跟进日期</label>
            <input type="date" id="followupDate">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full-col">
            <label>备注</label>
            <textarea id="notes" rows="2" placeholder="进展记录、对话摘要、注意事项..."></textarea>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Delete Confirm Modal ===== -->
<div class="overlay" id="deleteOverlay">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2>确认删除</h2>
    </div>
    <p class="delete-msg" id="deleteMsg"></p>
    <div class="modal-footer" style="padding:0 28px 28px">
      <button class="btn btn-ghost" id="deleteCancelBtn">取消</button>
      <button class="btn btn-danger" id="deleteConfirmBtn">删除</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
